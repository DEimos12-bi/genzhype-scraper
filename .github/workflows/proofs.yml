# GenZHype | proofs worker (r155). Captures one proof image per source URL cited
# by a timeline event on a published story page (articles through video_maker's
# hardened article crop; X, Reddit, TikTok and Instagram embeds in one Chromium
# session; YouTube thumbnails).
# r155 GIT BUS: the host firewall answers GitHub runner IPs with a 403 page
# (measured on the first two runs, no request reached PHP), so the job list comes
# from the proof-feed branch (pushed by the server's ~/genzhype-proofs-bridge.sh)
# and the captures go back on the proof-drop branch, where the same bridge
# ingests them with the api/proofingest.php checks. Same pattern as video-feed /
# video-drop.
# On demand: push a change to .social/proofs-trigger on main, or run it by hand.
name: proofs

on:
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".social/proofs-trigger"

concurrency:
  group: proofs
  cancel-in-progress: false

permissions:
  contents: write                # to push the captures to the proof-drop branch

jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker deps (numpy requests pillow playwright curl_cffi)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r proofs-worker/requirements.txt

      # Commands copied from video-maker.yml ("Install chromium for real-source
      # screenshots"). Non-fatal on purpose: YouTube thumbnails need no browser,
      # and when Chromium is missing the worker skips browser jobs WITHOUT
      # recording a failure against the URL, then exits 1 so the run shows red.
      - name: Install chromium
        continue-on-error: true
        timeout-minutes: 6
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      # Copied from video-maker.yml ("Vendor YuNet + Readability"), Readability
      # half only. video_maker.screenshot_articles injects vendor/Readability.js
      # to find the article column; without the file it uses its ancestor
      # heuristic.
      - name: Vendor Readability (optional)
        continue-on-error: true
        run: |
          mkdir -p vendor
          curl -sSL --max-time 60 -o vendor/Readability.js \
            "https://unpkg.com/@mozilla/readability@0.6.0/Readability.js" || true
          # a git-lfs pointer or a 404 page is worse than no file: the driver
          # would load it and throw. Drop anything implausibly small.
          for f in vendor/Readability.js; do
            if [ ! -s "$f" ] || [ "$(stat -c%s "$f")" -lt 20000 ]; then
              echo "discarding $f ($(stat -c%s "$f" 2>/dev/null || echo 0) bytes)"; rm -f "$f"
            else
              echo "vendored $f ($(stat -c%s "$f") bytes)"
            fi
          done

      - name: Job list from the proof-feed branch
        run: |
          rm -rf proof-feed && mkdir proof-feed
          if git fetch --depth 1 origin proof-feed; then
            git --work-tree=proof-feed checkout FETCH_HEAD -- .
            ls -la proof-feed
            echo "PROOFS_JOBS_FILE=$GITHUB_WORKSPACE/proof-feed/jobs.json" >> "$GITHUB_ENV"
          else
            echo "::error title=proofs worker::no proof-feed branch yet (the server bridge publishes it)"
            exit 1
          fi

      - name: Capture proofs
        timeout-minutes: 20
        env:
          PROOFS_DROP_DIR: /tmp/proof-drop
          PROOFS_BUDGET_S: "840"
          PROOFS_MAX: "25"
        run: python proofs-worker/proofs.py

      - name: Push captures to the proof-drop branch
        if: always()
        run: |
          if [ -z "$(ls -A /tmp/proof-drop 2>/dev/null)" ]; then echo "nothing to drop"; exit 0; fi
          cd /tmp/proof-drop
          git init -q
          git checkout -q -b proof-drop
          git add -A
          git -c user.name=proofs-worker -c user.email=bot@genzhype \
              commit -qm "proofs from run ${GITHUB_RUN_NUMBER} ($(date -u +%FT%TZ))"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" proof-drop
          echo "dropped $(ls | wc -l) file(s) to branch proof-drop"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
