name: GenZHype TikTok poster

# VIDEO POSTING (2026-08-08): pushes judged READY videos into the TikTok
# account's inbox as DRAFTS (unaudited-app legal path — owner taps publish
# in the app). Access token minted at runtime by our server's
# api/tt_refresh.php (it owns the rotating refresh token; only INGEST_TOKEN
# lives in GitHub secrets). Manual trigger: date > .social/tt_poke + push.
# Run log tee'd to .social/tt_last_run.log for server-side diagnosis.

on:
  schedule:
    - cron: '5 21 * * *'
    - cron: '45 22 * * *'
    - cron: '25 0 * * *'
    - cron: '5 2 * * *'
    - cron: '45 3 * * *'
  # STOOD DOWN 2026-08-08, and only after Buffer was PROVEN to publish:
  # https://www.tiktok.com/@genzhype0/video/7671760635599834400 went live
  # from buffer_poster.py (Buffer post status "sent", the new video id
  # confirmed on the account through TikTok's own video.list). Drafts are
  # no longer needed — Buffer publishes directly, so no one taps anything.
  #
  # The r73 note claiming "Buffer's API does not expose the TikTok channel"
  # was wrong: the channel was always there as service="tiktok". The real
  # failure was the vault-token step timing out before Python ever ran
  # (Hostinger's WAF dropping the runner), which left no log to read.
  #
  # TO REVIVE (if Buffer ever breaks): uncomment the two crons below. The
  # poster itself is untouched and still works — poke .social/tt_poke to
  # run it by hand at any time.
  # schedule:
  #   - cron: '30 22 * * *'
  #   - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.social/tt_poke'

permissions:
  contents: write

concurrency:
  group: tiktok-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upload video to TikTok inbox
        env:
          SOCIAL_BASE: 'https://genzhype.com'
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          set -o pipefail
          python tiktok_poster.py 2>&1 | sed "s/$INGEST_TOKEN/***/g" | tee .social/tt_last_run.log
      - name: Save poster state
        if: always()
        run: |
          git config user.name "genzhype-bot"
          git config user.email "bot@genzhype.com"
          git add .social 2>/dev/null || true
          git commit -m "tiktok poster state" 2>/dev/null || echo "no state change"
          git pull --rebase -q origin main || true
          git push 2>/dev/null || echo "nothing to push"
