name: GenZHype Bluesky poster
# 2026-11-08 owner: Bluesky stopped ("I don't care about it anymore"). Timer off, nothing posts there now.
# Run it by hand from the Actions tab if that ever changes; the 8 times a day it used were 15:25 17:05 18:45 21:25 23:05 00:45 02:25 04:05 UTC.
on:
  workflow_dispatch:
permissions:
  contents: write
# 2026-09-24: two runs at once could post the same video twice
concurrency:
  group: bsky-poster
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # was GitHub's default of 6 hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Post to Bluesky
        env:
          SOCIAL_BASE: 'https://genzhype.com'
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python bsky_poster.py
      - name: Save poster state
        run: |
          git config user.name "genzhype-bot"
          git config user.email "bot@genzhype.com"
          git add .social 2>/dev/null || true
          git commit -m "bluesky poster state" 2>/dev/null || echo "no state change"
          git push 2>/dev/null || echo "nothing to push"
