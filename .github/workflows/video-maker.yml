name: video-maker

# v3: renders one GenZHype short (9:16, photo scenes alternating with REAL
# stock b-roll, modern edge-tts narration + word-by-word captions, Gemini
# vision judge) per fresh page and POSTs it back to genzhype.com.
# Same token-gated feed + .social dedup pattern as the other posters.
#
# OPTIONAL secrets (every one may be absent — the driver degrades gracefully):
#   PEXELS_API_KEY / PIXABAY_API_KEY  -> real b-roll video scenes (free keys
#                                        from pexels.com/api, pixabay.com/api);
#                                        missing -> photos-only (v2 behaviour)
#   GEMINI_API_KEY                    -> vision judge on the finished mp4 AND
#                                        (v5) vision re-rank of stock b-roll
#                                        candidates against the narration
#                                        phrase (max ~8 calls/video, cached
#                                        per query); missing -> judge skipped
#                                        + first-candidate stock (v4.5)
#   YT_COOKIES                        -> (r24 FOOTAGE-FIRST) cookies.txt of a
#                                        logged-in secondary YouTube account;
#                                        with it yt-dlp survives the bot wall
#                                        and REAL FOOTAGE carries the video
#                                        (multi-window sections, budgets flip
#                                        to 8 scenes / min(30s, 60% runtime));
#                                        missing -> exact modest r13/r17
#                                        stills-first behavior
#
# QUOTA LEVER: set env VIDEO_VISION_RERANK: "0" below to disable ONLY the
# stock re-rank (keeps the judge) when the shared Gemini free tier runs hot.

on:
  schedule:
    - cron: "17 */6 * * *"      # every 6 hours
  # On-demand render trigger: a push that touches the sentinel file
  # .social/render-trigger starts a run. Lets the maintainer kick a test
  # render straight from the server (git push) without the Actions UI. The
  # end-of-run dedup commit only touches .social/video_done.txt (+ [skip ci]),
  # so a run never re-triggers itself.
  push:
    branches: [main]
    paths:
      - ".social/render-trigger"
  workflow_dispatch:
    inputs:
      batch:
        description: "How many videos to make this run"
        required: false
        default: "1"

concurrency:
  group: video-maker
  cancel-in-progress: false

permissions:
  contents: write                # to commit .social/video_done.txt

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
      VIDEO_BATCH: ${{ github.event.inputs.batch || '1' }}
      VIDEO_WORKDIR: build
      VIDEO_STATE_FILE: .social/video_done.txt
      # r25: YouTube bot-walls video downloads from CI IPs (all clients fail
      # even with valid cookies). Skip the doomed yt-dlp spawns (fast renders)
      # while keeping cookie/footage MODE on so the mismatched-stock kill stays
      # active and the video rides motion-strong real stills. Set to "1" only
      # r28: FOOTAGE IS BACK ON — Cloudflare WARP (set up below) + cookies beat
      # YouTube's bot-wall (proven). yt-dlp fetches real story clips again, so
      # the r24 footage-first engine goes live. If WARP/cookies ever fail, the
      # driver degrades to motion-lite stills automatically.
      # r31 (owner: "where the clips"): footage is BACK ON, but only for the
      # platforms the platform-check actually proved from CI — Kick, Twitch and
      # TikTok all downloaded fine there; YouTube 403'd even with WARP +
      # cookies. Spawning yt-dlp at YouTube is what ate the render clock and
      # timed out 4 renders in 2 days, so that one source stays off (flip
      # VIDEO_YT_FETCH to "1" the day a residential proxy exists).
      VIDEO_FOOTAGE_FETCH: "1"
      # r45: flipped 0 -> 1 on EVIDENCE. The warp-test result shows the unlock is
      # the COOKIES, not WARP: it downloaded successfully with "WARP NOT ACTIVE",
      # and failed 403 only in the warp-only (no cookies) mode. The comment above
      # ("403 even with WARP + cookies") was therefore wrong, and this flag was
      # switching off a path that already worked. The r45 HOOK LAW needs exactly
      # ONE windowed download (10s around the reporter's timestamp), not the
      # open-ended per-scene yt-dlp spawning that ate the render clock before.
      VIDEO_YT_FETCH: "1"
      # r25: motion-lite lean pipeline — skip the heavy/fragile ML niceties that
      # were hanging the runner (CLIP verify + whisperx forced-align). edge-tts
      # timings sync captions fine; there is no footage to CLIP-verify.
      VIDEO_CLIP_VERIFY: "0"
      VIDEO_FORCED_ALIGN: "0"
      # r29: footage-OFF makes EVERY scene a per-frame-resized motion still, so
      # the moviepy encode is far heavier than a footage render (real clips play
      # natively). That is what stalled compose for ~2.5 days. Cut the encode
      # cost: ultrafast x264 preset (size is fine for <60s social), 24fps (20%
      # fewer per-frame resizes), and 4 encode threads.
      VIDEO_PRESET: "ultrafast"
      VIDEO_FPS: "24"
      VIDEO_THREADS: "4"
      # TREATMENT V2: 2.5D depth parallax on photo scenes ("0" = classic)
      VIDEO_DEPTH_PARALLAX: "1"
      VIDEO_DEPTH_MODEL: "build/depth_vits.onnx"
      # FREE-AI VISION ROTATION (2026-08-06): judge/gate fallback tiers.
      # Same Gemini key carries gemma-4-31b (14,400 RPD) + flash-lite
      # (500 RPD); Groq qwen3.6 vision (1,000 RPD, <=5 imgs/call);
      # Cloudflare llama-3.2-11b-vision (10k neurons/day, 1 img/call).
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
      # r29: abandon a page after 1 retry if the judge keeps failing it, so a
      # visually-poor story (repetition / irrelevant stock the judge rightly
      # rejects) can never freeze the queue behind it. Good stories pass on
      # attempt 1 and are unaffected.
      VIDEO_REPLAN_CAP: "1"
      # Point the driver at the vendored Turbo tree so it reuses voice.py.
      MPT_HOME: ${{ github.workspace }}/videorepos/mpt
      # v3 OPTIONAL keys — unset secrets expand to "" and the driver treats
      # empty as disabled, so no step ever fails when these are absent.
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # r24: logged-in YouTube cookies.txt (secondary account). Written to a
      # FILE by the step below — the driver only ever reads the file, and
      # GitHub masks the secret in any accidental log output anyway.
      YT_COOKIES: ${{ secrets.YT_COOKIES }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify ffmpeg + fonts (preinstalled on ubuntu-latest)
        # Resolve the runner's REAL ffmpeg path dynamically — hardcoding /usr/bin/ffmpeg
        # broke run #1 (current runners ship it elsewhere). moviepy + the faststart
        # remux both honor IMAGEIO_FFMPEG_EXE; if ffmpeg were ever missing entirely,
        # the pip-installed imageio-ffmpeg bundles its own binary as the fallback.
        #
        # run #230 ROOT CAUSE: some runner images now ship WITHOUT ffmpeg
        # (GitHub rolls images gradually — #229 had it, #230 didn't), and the
        # apt fallback had NO time bound, so one stalled mirror hung the job
        # 23+ min. Fix keeps every layer and bounds the network instead:
        #   1) system ffmpeg (fast path, unchanged)
        #   2) apt, TIME-BOUNDED (a dead mirror now costs <=4.5 min, not the job)
        #   3) pip static-ffmpeg — verified from its own docs: ships BOTH
        #      ffmpeg AND ffprobe (pydub's sound mix needs ffprobe), Ubuntu-CI
        #      tested, no sudo needed for the binaries themselves
        #   4) imageio-ffmpeg bundled binary (moviepy-only, last resort, as before)
        timeout-minutes: 10
        run: |
          FF="$(command -v ffmpeg || true)"
          if [ -z "$FF" ]; then
            echo "no system ffmpeg; bounded apt install (pydub needs ffprobe too)"
            sudo timeout 120 apt-get update -qq \
              -o Acquire::Retries=2 -o Acquire::http::Timeout=15 || true
            sudo timeout 150 apt-get install -y -qq ffmpeg \
              -o Acquire::Retries=2 -o Acquire::http::Timeout=15 \
              -o DPkg::Lock::Timeout=60 || true
            FF="$(command -v ffmpeg || true)"
          fi
          if [ -z "$FF" ]; then
            echo "apt failed; static-ffmpeg pip fallback (ffmpeg + ffprobe)"
            python3 -m pip install --quiet static-ffmpeg || true
            PATHS="$(timeout 240 static_ffmpeg_paths 2>/dev/null || true)"
            FFS="$(echo "$PATHS" | sed -n 's/^FFMPEG=//p')"
            FFP="$(echo "$PATHS" | sed -n 's/^FFPROBE=//p')"
            [ -n "$FFS" ] && sudo ln -sf "$FFS" /usr/local/bin/ffmpeg
            [ -n "$FFP" ] && sudo ln -sf "$FFP" /usr/local/bin/ffprobe
            FF="$(command -v ffmpeg || true)"
          fi
          if [ -n "$FF" ]; then
            echo "IMAGEIO_FFMPEG_EXE=$FF" >> "$GITHUB_ENV"
            echo "ffmpeg at: $FF"
            "$FF" -hide_banner -encoders | grep -E "libx264|aac " || true
          else
            echo "WARNING: no ffmpeg from any layer; moviepy falls back to imageio-ffmpeg's bundled binary"
          fi
          fc-list | grep -iE "dejavu|liberation" | head || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal render deps
        # Minimal real subset of Turbo's requirements needed for a headless,
        # single-image render. moviepy pulls numpy/Pillow/imageio automatically;
        # we pin them explicitly for reproducibility. edge_tts = TTS + word
        # boundaries. pydub kept for parity with Turbo's voice.py (lazy import).
        # opencv-python-headless (v6) = haarcascade face detection for the
        # face-aware phone framing; if it ever fails to import, the driver
        # silently falls back to center crops (never fatal).
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "moviepy==2.2.1" \
            "edge-tts==7.2.7" \
            "pydub==0.25.1" \
            "Pillow>=10.3" \
            "numpy>=1.26" \
            "requests>=2.31" \
            "imageio-ffmpeg>=0.5" \
            "curl_cffi>=0.7" \
            "opencv-python-headless>=4.9,<5" \
            "onnxruntime>=1.18"

      # TREATMENT V2 (2026-08-05): Depth-Anything-V2-Small ONNX for the 2.5D
      # depth-parallax photo scenes. vitS checkpoint ONLY (Apache-2.0 —
      # Base/Large are CC-BY-NC, never ship those). Measured on this runner
      # class: 0.85s/photo depth, 8.4ms/frame warp (depth-bench run #1).
      # Missing/failed download = maker logs "no model" and renders classic
      # motion. Kill switch: env VIDEO_DEPTH_PARALLAX: "0".
      - name: depth model (treatment v2)
        continue-on-error: true
        run: |
          mkdir -p build
          curl -sL --retry 2 -o build/depth_vits.onnx \
            https://github.com/fabio-sim/Depth-Anything-ONNX/releases/download/v2.0.0/depth_anything_v2_vits.onnx
          echo "depth model bytes: $(wc -c < build/depth_vits.onnx)"

      # r14 CLIP VERIFYING EYE (optional, quota-free): sentence-transformers
      # CLIP ViT-B-32 scores each photo scene's image against the words
      # spoken over it and swaps clear mismatches to a better pool image —
      # all on the runner CPU, zero API quota. The ~605MB model downloads at
      # first use inside the render step; the driver tolerates a failed
      # install/download by skipping the check entirely, so this step is
      # non-fatal. Kill switch: env VIDEO_CLIP_VERIFY: "0".
      # r25: ML stack (torch + sentence-transformers + whisperx, ~1GB) DISABLED.
      # It powered CLIP-verify (matches a photo to the words) and whisperx
      # forced-alignment (precise caption sync) — both quality niceties. In
      # motion-lite mode there is no footage to CLIP-verify, and edge-tts's own
      # word timings sync captions fine. Downloading ~1GB of models on the
      # runner was HANGING the job (runs #105/#106 timed out at 30min). Cutting
      # it makes renders lean and reliable; VIDEO_CLIP_VERIFY/FORCED_ALIGN=0 in
      # env keep the driver from even trying to load them. Re-add if footage
      # ever comes back (e.g. via a residential proxy).
      - name: ML stack disabled (motion-lite — lean + reliable)
        run: echo "CLIP + whisperx skipped (VIDEO_CLIP_VERIFY=0, VIDEO_FORCED_ALIGN=0)"

      # r18 GRAFT A FORCED ALIGNMENT (optional): whisperx measures the REAL
      # word timings from the rendered audio (edge-tts's self-reported cues +
      # r12 concat offsets are what make the narration read LATE). CPU-only
      # torch (no CUDA bloat); the ~360MB wav2vec2 align model downloads at
      # first use inside the render step. The driver treats a failed install
      # OR a failed model download as "keep edge timings", so this step is
      # non-fatal. Kill switch: env VIDEO_FORCED_ALIGN: "0".


      # r13/r24 REAL FOOTAGE (optional): yt-dlp fetches short MUTED sections
      # of the story's own YouTube videos. Cookie-less: the modest r13/r17
      # budgets (<=3.5s shown per scene, max ~8-12 borrowed seconds — the
      # drama-channel fair-use posture) and YouTube frequently bot-walls the
      # runner IP anyway. WITH the YT_COOKIES file (r24 FOOTAGE-FIRST) the
      # downloads actually succeed and footage carries the video: up to 3
      # DIFFERENT windows per id, 8 footage scenes, min(30s, 60% of runtime)
      # borrowed, throttled to 12 yt-dlp attempts/run with 2-4s sleeps
      # (burner-account safety). The driver falls back to the thumbnail
      # still on every miss, so this step and the feature are both
      # non-fatal. Kill switch: VIDEO_REAL_FOOTAGE=0.
      # Unpinned on purpose: YouTube breaks old yt-dlp versions constantly.
      - name: Install yt-dlp (+ curl_cffi for Twitch/TikTok/Kick impersonation)
        if: env.VIDEO_FOOTAGE_FETCH == '1'   # r29: skip when footage off (fast motion-lite)
        continue-on-error: true
        run: |
          # r28: [curl-cffi] is the whole trick for Twitch/TikTok/Kick — it lets
          # yt-dlp --impersonate chrome present a real-browser TLS fingerprint
          # and walk past their Cloudflare bot-wall (no cookies, no WARP needed).
          python -m pip install -U "yt-dlp[default,curl-cffi]"
          yt-dlp --list-impersonate-targets 2>/dev/null | grep -ciE "chrome|safari" \
            && echo "impersonation ready" || echo "impersonation NOT available"

      # ==================================================================
      # r57: THE CLOUDFLARE WARP STEP IS DELETED. DO NOT BRING IT BACK.
      # ==================================================================
      # WARP was a WireGuard tunnel carrying ALL of the runner's egress, added
      # in r28 to beat YouTube's bot-wall. r32 already found it was "pure
      # downside" and gated it behind VIDEO_YT_FETCH. r45 then flipped
      # VIDEO_YT_FETCH 0 -> 1 for the hook clip — which SILENTLY RE-ARMED THE
      # TUNNEL. Renders started stalling that same night.
      #
      # MEASURED by the tts-test workflow (.social/tts-test-result.txt), same
      # job, identical probes run with the tunnel down and then up:
      #   8MB download, off-Cloudflare host   WARP off: 9,404,568 bytes in 1s
      #                                       WARP on:          0 bytes in 60s
      #   YouTube money clip (WITH cookies)   WARP off: "Sign in to confirm
      #                                       you're not a bot"
      #                                       WARP on:  the SAME failure
      #
      # So the tunnel black-holes large transfers and does NOT unlock YouTube.
      # That is what produced three unrelated network stalls inside one render
      # (archive.org read timeout, Playwright goto timeout, and the edge-tts
      # body segment hanging forever) and the STALLED:tts force-kills.
      #
      # Footage is unaffected: Kick/Twitch/TikTok never needed WARP (curl_cffi
      # impersonation is what walks past their bot-wall), and YouTube is
      # bot-walled with or without it. VIDEO_YT_FETCH stays at "1" — the flag
      # and the tunnel are different things, and only the tunnel was harmful.
      # If YouTube footage is wanted back, the answer is a residential proxy or
      # fresh cookies, NOT this tunnel.

      # r24 FOOTAGE-FIRST: write the logged-in cookies.txt where the driver
      # looks for it (<VIDEO_WORKDIR>/yt_cookies.txt). printf to a file only
      # — the secret value is NEVER echoed to the log (and GitHub masks it
      # regardless). Absent/empty secret -> no file -> the driver keeps the
      # exact cookie-less stills-first behavior. Non-fatal by construction.
      - name: Write YouTube cookies file (optional)
        continue-on-error: true
        run: |
          mkdir -p "$VIDEO_WORKDIR"
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > "$VIDEO_WORKDIR/yt_cookies.txt"
            chmod 600 "$VIDEO_WORKDIR/yt_cookies.txt"
            echo "cookies file written ($(wc -c < "$VIDEO_WORKDIR/yt_cookies.txt") bytes)"
          else
            echo "YT_COOKIES not set; footage runs cookie-less (stills-first mode)"
          fi

      # OPTIONAL: extra deps so the driver imports and reuses Turbo's REAL
      # app.services.voice (its top-level imports need loguru/toml/openai).
      # Non-fatal: if this fails, video_maker.py falls back to its faithful
      # in-file edge-tts port, so the render still succeeds.
      - name: Enable real Turbo voice reuse (optional)
        continue-on-error: true
        run: |
          python -m pip install "loguru==0.7.3" "toml>=0.10" "openai==2.24.0"

      # v10 REAL-SOURCE SCREENSHOTS (optional): chromium to screenshot the
      # actual article pages as evidence ("original pixels"). Non-fatal —
      # missing browser just means the rendered cards are used instead.
      - name: Install chromium for real-source screenshots (optional)
        continue-on-error: true
        timeout-minutes: 6          # r25: fail fast if the download hangs (was a
                                    # silent 30-min hang risk) — screenshots are
                                    # optional, cards render without them
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      # r32 VENDORED OSS (both optional — the driver degrades to its own
      # heuristics if either is missing):
      #   YuNet   = OpenCV's CNN face detector (opencv/opencv_zoo). Replaces the
      #             haar cascade that missed every turned head and left the
      #             crop centred on a torso. NOTE: the raw.githubusercontent
      #             URL serves a 131-byte git-lfs POINTER, not the model — the
      #             media.githubusercontent LFS host is the real one.
      #   Readability.js = Mozilla's Reader Mode engine, used to decide which
      #             part of a page is the article (see _CROP_JS).
      # r37 GITHUB BUS (inbound): the server publishes feed.json + the story's
      # visuals to the video-feed branch; a runner whose IP bitninja has
      # blackholed still gets the job. Branch absent -> HTTP feed as before.
      - name: Checkout job feed from video-feed branch (optional)
        continue-on-error: true
        run: |
          if git fetch --depth 1 origin video-feed 2>/dev/null; then
            rm -rf feeddir && mkdir feeddir
            git --work-tree=feeddir checkout FETCH_HEAD -- . 2>/dev/null || true
            ls -la feeddir/ || true
            echo "VIDEO_FEED_DIR=$GITHUB_WORKSPACE/feeddir" >> "$GITHUB_ENV"
          else
            echo "no video-feed branch; HTTP feed only"
          fi

      - name: Vendor YuNet + Readability (optional)
        continue-on-error: true
        run: |
          mkdir -p models vendor
          curl -sSL --max-time 60 -o models/face_detection_yunet_2023mar.onnx \
            "https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx" || true
          curl -sSL --max-time 60 -o vendor/Readability.js \
            "https://unpkg.com/@mozilla/readability@0.6.0/Readability.js" || true
          # a git-lfs pointer or a 404 page is worse than no file: the driver
          # would load it and throw. Drop anything implausibly small.
          for f in models/face_detection_yunet_2023mar.onnx vendor/Readability.js; do
            if [ ! -s "$f" ] || [ "$(stat -c%s "$f")" -lt 20000 ]; then
              echo "discarding $f ($(stat -c%s "$f" 2>/dev/null || echo 0) bytes)"; rm -f "$f"
            else
              echo "vendored $f ($(stat -c%s "$f") bytes)"
            fi
          done

      # The driver imports Turbo's app.services.voice from MPT_HOME when present.
      # It ALSO has a self-contained edge-tts fallback, so this step is optional:
      # if videorepos/mpt is not vendored in the repo, the run still succeeds.
      - name: Report Turbo tree availability
        run: |
          if [ -d "$MPT_HOME/app/services" ]; then
            echo "Turbo voice module present at $MPT_HOME (will be reused)"
          else
            echo "Turbo tree not vendored; driver uses its in-file edge-tts fallback"
          fi

      # r29 DIAGNOSTIC: prove the runner (a datacenter IP) can actually POST to
      # the receive endpoint. If media/heartbeat.log gets 'runner_egress_test',
      # egress is fine; if not, Hostinger's WAF is silently dropping runner POSTs
      # — which would also explain why finished videos never deliver.
      - name: Egress probe (runner -> receive endpoint)
        run: |
          code=$(curl -sS -o /tmp/eg.txt -w "%{http_code}" --max-time 25 -X POST \
            "https://genzhype.com/api/video_receive.php" \
            -H "Content-Type: application/json" \
            --data "{\"token\":\"${INGEST_TOKEN}\",\"action\":\"heartbeat\",\"page_id\":0,\"stage\":\"runner_egress_test\",\"elapsed\":0}") || true
          echo "egress HTTP=$code body=$(cat /tmp/eg.txt 2>/dev/null)"

      - name: Render + post video(s)
        timeout-minutes: 18         # r29: give the still-motion encode room to FINISH;
                                    # the in-process compose watchdog (900s) is the real
                                    # guard. This is just the hard backstop.
        run: |
          set -o pipefail
          mkdir -p "$VIDEO_WORKDIR"     # tee must not fail the render itself
          python video_maker.py 2>&1 | tee "$VIDEO_WORKDIR/render.log"

      # r34 SHIP THE LOG. There is no GitHub token on the Hostinger box, so
      # Actions logs are unreadable from where the debugging actually happens —
      # a driver crash showed up only as the heartbeat going quiet, twice.
      # if: always() so a FAILED render is exactly the one that reports.
      - name: Ship render log to the server
        if: always()
        continue-on-error: true
        run: |
          LOG="$VIDEO_WORKDIR/render.log"
          [ -s "$LOG" ] || { echo "no render log"; exit 0; }
          tail -c 120000 "$LOG" | base64 -w0 > /tmp/log.b64
          python - <<'PY'
          import json, os, urllib.request
          body = json.dumps({"token": os.environ["INGEST_TOKEN"], "action": "diag",
                             "page_id": 0, "name": "render-log",
                             "text_b64": open("/tmp/log.b64").read()}).encode()
          req = urllib.request.Request(
              "https://genzhype.com/api/video_receive.php", data=body,
              headers={"Content-Type": "application/json",
                       "User-Agent": "Mozilla/5.0"})
          try:
              print("log shipped:", urllib.request.urlopen(req, timeout=60).read()[:200])
          except Exception as e:
              print("log ship failed:", e)
          PY

      # r35 WAF-PROOF DROP. Run #154 rendered a complete video and binned it:
      # Hostinger blackholed POSTs from the runner (the egress probe burned its
      # full 25s --max-time with no reply), so delivery, heartbeats and even the
      # log shipper all failed. The runner can always reach GITHUB though, so on
      # a failed render the artifacts go to a force-pushed orphan branch and the
      # server side pulls them. Only on failure — a 44MB drop per run is not
      # something to do when delivery worked.
      - name: Drop artifacts to video-drop branch (delivery fallback)
        # r37: if: always() — post_video now stages drop-meta-*.json instead of
        # failing the run when HTTP delivery dies, so the drop must fire on
        # green runs too. Nothing staged -> the step exits in a second.
        if: always()
        continue-on-error: true
        run: |
          # drop when: the run FAILED (diagnosis needs log + frames) or a
          # drop-meta exists (HTTP delivery failed on an otherwise green run).
          FAILED="${{ job.status == 'failure' }}"
          HAVE_META=0; ls "$VIDEO_WORKDIR"/drop-meta-*.json >/dev/null 2>&1 && HAVE_META=1
          if [ "$FAILED" != "true" ] && [ "$HAVE_META" != "1" ]; then
            echo "delivery worked and run is green; nothing to drop"; exit 0
          fi
          mkdir -p /tmp/drop
          cp -f "$VIDEO_WORKDIR"/drop-meta-*.json /tmp/drop/ 2>/dev/null || true
          cp -f "$VIDEO_WORKDIR"/video-*.mp4      /tmp/drop/ 2>/dev/null || true
          cp -f "$VIDEO_WORKDIR"/sheet-*.jpg      /tmp/drop/ 2>/dev/null || true
          cp -f "$VIDEO_WORKDIR"/reject-*.jpg     /tmp/drop/ 2>/dev/null || true
          cp -f "$VIDEO_WORKDIR"/shot-*.png       /tmp/drop/ 2>/dev/null || true
          cp -f "$VIDEO_WORKDIR"/render.log       /tmp/drop/ 2>/dev/null || true
          ls -la /tmp/drop || true
          [ -n "$(ls -A /tmp/drop 2>/dev/null)" ] || { echo "nothing to drop"; exit 0; }
          cd /tmp/drop
          git init -q
          git checkout -q -b video-drop
          git add -A
          git -c user.name=video-maker -c user.email=bot@genzhype \
              commit -qm "drop from run ${GITHUB_RUN_NUMBER} ($(date -u +%FT%TZ))"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" video-drop
          echo "dropped $(ls | tr '\n' ' ')to branch video-drop"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit dedup state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # r16: the replan book (.social/video_replans.txt) commits alongside
          # the done-list; the || true guards keep an absent file from ever
          # failing this step.
          if [ -n "$(git status --porcelain .social/video_done.txt .social/video_replans.txt 2>/dev/null || true)" ]; then
            git add .social/video_done.txt || true
            git add .social/video_replans.txt || true
            git commit -m "video-maker: update dedup state [skip ci]"
            # r25: the on-demand render trigger means the maintainer may push to
            # main WHILE a render runs, so main can advance under us -> the plain
            # push was rejected (non-fast-forward) and turned the whole run red
            # even though the video delivered fine. Rebase + retry a few times so
            # this bookkeeping commit never fails the run.
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && break
              echo "push race (attempt $i); retrying"; sleep $((RANDOM % 4 + 2))
            done
          else
            echo "no dedup changes to commit"
          fi
