name: tiktok-intel

# Rival TikTok observation — the half of a "study" we never did: what real
# accounts in our lane actually POST, as counts. Runs on a runner because the
# only way past TikTok's request signing is a real browser, and this is where
# Playwright lives. Read-only: it collects, it never posts.

on:
  push:
    branches: [main]
    paths:
      - ".social/tiktok-intel-trigger"
  schedule:
    - cron: '20 5 * * *'        # daily, well away from the posting windows
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tiktok-intel
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TikTok-Api + a real browser
        # The browser IS the mechanism: TikTok signs its API requests in the
        # page, so plain HTTP (which is all our server can do) gets an empty
        # shell. Playwright's chromium produces real signatures.
        run: |
          python -m pip install --upgrade pip
          python -m pip install TikTokApi
          python -m playwright install --with-deps chromium

      - name: Observe rivals
        continue-on-error: true
        env:
          ms_token: ${{ secrets.TIKTOK_MS_TOKEN }}
          TIKTOK_RIVALS: ${{ vars.TIKTOK_RIVALS }}
        run: python -u tiktok_intel.py 2>&1 | tee tiktok_intel.log

      - name: Publish what it saw
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/drop && cd /tmp/drop
          cp "$GITHUB_WORKSPACE/tiktok_intel.log" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/tiktok_intel.json" . 2>/dev/null || true
          git init -q && git checkout -q -b tiktok-intel-drop
          git add -A
          git -c user.name=tiktok-intel -c user.email=bot@genzhype \
              commit -qm "tiktok intel $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tiktok-intel-drop
