name: GenZHype intelligence brain

# r77-r79: the full outward-facing intelligence engine, one daily run.
# Order matters:
#   1. forum collector (runner-side, Reddit RSS via browser impersonation,
#      zero credentials) ships craft-subreddit posts to the site
#   2. rival-video learner (server-side) studies rival Shorts outliers
#   3. story staleness watcher (server-side) re-checks published stories
#   4. intel brain (server-side) reads trends + press, feeds the story
#      queue, and writes the daily brief LAST so it sees everything above
# Server-side pokes are deliberate: the server reaches googleapis/Exa
# reliably while GitHub runners get randomly blackholed by Hostinger's WAF.

on:
  schedule:
    - cron: '35 9 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.social/intel_poke'

permissions:
  contents: read

concurrency:
  group: video-intel
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect creator-craft forum posts
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          pip install -q curl_cffi || echo "curl_cffi unavailable; urllib fallback"
          python intel_forums.py || echo "forum collection failed this run; brief will use press+trends only"
      - name: Rival video learner
        if: always()
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          for i in 1 2 3; do
            OUT=$(curl -s --max-time 300 "https://genzhype.com/api/video_intel_run.php?token=$INGEST_TOKEN&per=50" || true)
            if echo "$OUT" | grep -q '"ok":true'; then echo "$OUT" | sed "s/$INGEST_TOKEN/***/g"; exit 0; fi
            echo "attempt $i failed; retrying"; sleep $((i * 20))
          done
          echo "unreachable after 3 attempts"; exit 1
      - name: Story staleness watcher
        if: always()
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          for i in 1 2 3; do
            OUT=$(curl -s --max-time 300 "https://genzhype.com/api/story_watch_run.php?token=$INGEST_TOKEN" || true)
            if echo "$OUT" | grep -q '"ok":true'; then echo "$OUT" | sed "s/$INGEST_TOKEN/***/g"; exit 0; fi
            echo "attempt $i failed; retrying"; sleep $((i * 20))
          done
          echo "unreachable after 3 attempts"; exit 1
      - name: Intel brain (trends -> story queue, press sweep, daily brief)
        if: always()
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          for i in 1 2 3; do
            OUT=$(curl -s --max-time 300 "https://genzhype.com/api/intel_run.php?token=$INGEST_TOKEN" || true)
            if echo "$OUT" | grep -q '"ok":true'; then echo "$OUT" | sed "s/$INGEST_TOKEN/***/g"; exit 0; fi
            echo "attempt $i failed; retrying"; sleep $((i * 20))
          done
          echo "unreachable after 3 attempts"; exit 1
