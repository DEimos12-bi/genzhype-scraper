name: GenZHype metrics collector

# PERFORMANCE FEEDBACK LOOP (2026-08-08): once a day, read views/likes/
# comments/shares for our own posted videos (YouTube videos.list + TikTok
# video.list) and push snapshots to the site DB (api/metrics_ingest.php).
# Also triggers the TikTok draft->published matching server-side.
# Degrades gracefully while scopes are missing ("skipped" lines).
# Manual trigger: date > .social/metrics_poke + push.

on:
  schedule:
    - cron: '15 10 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.social/metrics_poke'

permissions:
  contents: write

concurrency:
  group: metrics-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect metrics
        env:
          SOCIAL_BASE: 'https://genzhype.com'
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          set -o pipefail
          python metrics_collector.py 2>&1 | sed "s/$INGEST_TOKEN/***/g" | tee .social/metrics_last_run.log

      # r115: Instagram and Facebook were 10 posts each with ZERO measured,
      # because the Meta app behind our own tokens has been deleted. Buffer
      # already publishes to all three accounts and its API answers from our
      # server, so the collector for those platforms is server-side PHP — it
      # only needs a daily heartbeat, which this job already is. Non-fatal:
      # the YouTube collection above must never fail because of it.
      - name: Pull IG/FB/TikTok numbers from Buffer
        continue-on-error: true
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          curl -s --max-time 120 \
            "https://genzhype.com/api/social_metrics_pull.php?token=$INGEST_TOKEN" \
            | sed "s/$INGEST_TOKEN/***/g" | tee -a .social/metrics_last_run.log

      # r131: daily defamation-shield repair — rewrites unframed claims on
      # unconfirmed drama events; pages whose gate turns green earn their
      # index back on the spot (the owner's "fix and earn" decision).
      - name: Repair alleged-framing (fix and earn)
        continue-on-error: true
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          curl -s --max-time 280 \
            "https://genzhype.com/api/framing_repair.php?token=$INGEST_TOKEN&cap=30" \
            | sed "s/$INGEST_TOKEN/***/g" | tee -a .social/metrics_last_run.log

      # THE PRODUCER (2026-08-20): the daily budget meeting. Runs AFTER the
      # metrics pull above, so it scores with today's numbers and its own
      # self-review sees fresh results. Picks 5 topics across ALL lanes and
      # queues their renders. Non-fatal: a failed meeting must never break the
      # metrics job, and the site simply keeps yesterday's queue.
      - name: Producer — daily greenlight (5 topics, all lanes)
        continue-on-error: true
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          curl -s --max-time 280 \
            "https://genzhype.com/api/producer_run.php?token=$INGEST_TOKEN&review=1" \
            | sed "s/$INGEST_TOKEN/***/g" | tee -a .social/metrics_last_run.log

      - name: Save log
        if: always()
        run: |
          git config user.name "genzhype-bot"
          git config user.email "bot@genzhype.com"
          git add .social 2>/dev/null || true
          git commit -m "metrics collector log" 2>/dev/null || echo "no change"
          git pull --rebase -q origin main || true
          git push 2>/dev/null || echo "nothing to push"
