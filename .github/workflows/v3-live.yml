name: v3-live

# THE PLUG (step 2 of the switch, 2026-10-28): v3 takes the live system's jobs (the same video-feed branch that
# video-maker.yml reads) and makes their videos with v3/live.py.
#   mode shadow  (the default): the video is kept with the run for one day (never on a branch); NOTHING is sent to the site,
#                nothing is posted, the live maker's done-list is not touched. This is the test run of step 3.
#   mode deliver: the videos go to the site exactly like video-maker.yml sends them (api/video_receive.php, the same
#                token and fields), so the posters publish them. Step 4 only, on the owner's word.
# STEP 4 (2026-10-29, owner: "go step 4"): tried every hour, at most 8 videos a day, DELIVERED to the site (scheduled runs have no
# inputs, so they deliver); the site's posters publish it. By hand the mode input still chooses (default shadow = a test).
# The old maker (video-maker.yml) is switched off, not deleted. A scheduled run makes up to 2 videos: a run on a GitHub
# machine the site's firewall blocks makes none, and the next run makes up for it.

on:
  push:                      # THE RELIABLE CLOCK (2026-11-03): the server's 30-minute bridge job pushes .social/v3_poke when the day still needs videos
    branches: [main]
    paths: ['.social/v3_poke']
  schedule:                  # GitHub's own timer: only a backup (it is late or dropped under load)
    - cron: "47 0-13 * * *"   # 2026-11-01 owner: after the day's pages are finished (UTC day), making runs 00:47-13:47 UTC, so the videos are ready before the US posting window (16:00 UTC); live.py stops at 8
  workflow_dispatch:
    inputs:
      mode:
        description: "shadow (keep the video, send nothing), deliver (hand it to the site: step 4 only) or keys (check which AI keys answer, no video)"
        required: false
        default: "shadow"
      batch:
        description: "how many jobs in this run"
        required: false
        default: "1"
      day:
        description: "the page day to make videos for, YYYY-MM-DD (empty = yesterday, the last finished day)"
        required: false
        default: ""
      hop:
        description: "how many runs this chain has started already (the chain stops at 12)"
        required: false
        default: "0"
      page:
        description: "one page id from the feed (empty = the next job v3 has not made)"
        required: false
        default: ""
      style:
        description: "narrator style for this run: empty = the normal dry narrator, funny = the funny-friend test (owner, 2026-11-08)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write             # the chain: a run starts the next one

concurrency:
  group: v3-live
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch the job feed (the live system's video-feed branch)
        run: |
          rm -rf feed && mkdir feed
          if git fetch --depth 1 origin video-feed:video-feed 2>/dev/null; then git archive video-feed | tar -x -C feed; fi
          ls -la feed | head -10

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache the browser and the pip wheels
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/pip
            ~/.cache/huggingface
          key: v3-live-${{ runner.os }}-1

      - name: Install (ffmpeg, Chromium, the voice, the speech model, the clip tools)
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq >/dev/null 2>&1 || true; sudo timeout 200 apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true; }
          ffmpeg -version | head -1
          python -m pip install --upgrade pip 2>&1 | tail -1
          python -m pip install -r v3/requirements.txt faster-whisper scenedetect brotli soundfile "yt-dlp[default,curl-cffi]" 2>&1 | tail -2
          python -m playwright install --with-deps chromium 2>&1 | tail -2
          sudo timeout 120 apt-get install -y -qq fonts-noto-color-emoji >/dev/null 2>&1 || echo "no emoji font"

      - name: Make the videos
        env:
          VIDEO_FEED_DIR: feed
          MODE: ${{ github.event.inputs.mode || 'deliver' }}
          BATCH: ${{ github.event.inputs.batch }}
          PAGE: ${{ github.event.inputs.page }}
          DAY: ${{ github.event.inputs.day }}
          V3_STYLE: ${{ github.event.inputs.style }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          # every AI key at once (owner, 2026-10-28): the site's keys, and the videos' own keys once they are added
          # as repository secrets under these names (the order of models is in v3/config.json); four were saved with extra
          # characters in their names (GEMINI_API_KEYL12 ...): those names are read first, the clean names after
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2L5 || secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3L12 || secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEYL12 || secrets.GEMINI_API_KEY_5 }}
          AI_PROBE_NVIDIA: ${{ secrets.AI_PROBE_NVIDIA }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2L34 || secrets.NVIDIA_API_KEY_2 }}
          NVIDIA_API_KEY_3: ${{ secrets.NVIDIA_API_KEY_3 }}
          NVIDIA_API_KEY_4: ${{ secrets.NVIDIA_API_KEYL0 || secrets.NVIDIA_API_KEY_4 }}
          NVIDIA_API_KEY_5: ${{ secrets.AI_PROBE_NVIDIA_DIRECTOR }}
          AI_PROBE_NVIDIA_DIRECTOR: ${{ secrets.AI_PROBE_NVIDIA_DIRECTOR }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          AI_PROBE_OPENROUTER: ${{ secrets.AI_PROBE_OPENROUTER }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
        run: |
          mkdir -p drop
          if [ "$MODE" = "keys" ]; then python v3/keycheck.py 2>&1 | tee drop/keys.log; exit 0; fi
          extra=""
          [ "$MODE" = "deliver" ] && extra="--deliver"
          [ -n "$PAGE" ] && extra="$extra --page $PAGE"
          [ -n "$DAY" ] && extra="$extra --day $DAY"
          ( timeout 6600 python v3/live.py --source daily --batch "${BATCH:-2}" --budget 3300 $extra 2>&1 | tee drop/run.log ) || echo "no video this run (the reason is in drop/run.log)"
          for w in v3/work/live-*/; do p=$(basename "$w" | sed 's/live-//'); [ -f "$w/out/report.json" ] && mkdir -p "drop/$p" && cp "$w/out/report.json" "drop/$p/" || true; done
          ls -laR drop | head -40

      - name: Videos never stay on public GitHub (owner, 2026-11-01)
        if: always()
        env:
          MODE: ${{ github.event.inputs.mode || 'deliver' }}
        run: |
          # the repository is public: a finished video must not be downloadable here before it is posted.
          # Delivered videos live on the site only; a shadow test keeps its video with the run for one day (to watch it).
          if [ "$MODE" != "shadow" ]; then find drop -type f \( -name '*.mp4' -o -name 'cover.jpg' \) -delete 2>/dev/null || true; fi
          ls -laR drop | head -30

      - name: Keep the results with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-live-results
          path: drop
          retention-days: 1

      - name: Push the results to the v3-drop branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd drop
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b v3-drop
          find . -type f \( -name '*.mp4' -o -name '*.jpg' \) -delete 2>/dev/null || true      # logs and reports only, never a video
          git add -A
          git commit -q -m "v3 live results $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nothing to push"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" v3-drop || true

      - name: Videos the site refused directly -> the video-drop branch (the server's bridge collects it)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          [ -d video-drop-out ] && [ -n "$(ls video-drop-out)" ] || { echo "nothing for the video-drop branch"; exit 0; }
          cd video-drop-out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b video-drop
          git add -A
          git commit -q -m "v3 drop $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" video-drop && echo "pushed to video-drop"

      - name: Keep v3's own done-list (never the live maker's, unless mode deliver)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODE: ${{ github.event.inputs.mode || 'deliver' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          for f in .social/v3_done.txt .social/v3_failed.txt; do [ -f "$f" ] && git add "$f"; done      # one by one: a missing file must not stop the other
          if [ "$MODE" = "deliver" ] && [ -f .social/video_done.txt ]; then git add .social/video_done.txt; fi
          git commit -q -m "v3-live: done-list" || { echo "nothing to keep"; exit 0; }
          for i in 1 2 3 4 5; do
            if git pull -q --rebase --autostash origin main && git push -q origin HEAD:main; then echo "kept"; exit 0; fi
            sleep $((i * 4))
          done
          echo "::warning::v3 done-list not pushed after 5 attempts"

      - name: The chain - start the next run while the day still needs videos
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event.inputs.mode || 'deliver' }}
          HOP: ${{ github.event.inputs.hop || '0' }}
          DAY: ${{ github.event.inputs.day }}
        run: |
          # work until done (2026-11-03): the first run of the day keeps the day going, run after run, until its 8 videos
          # exist or every pick is made or parked; at most 12 runs in one chain
          next=$(cat drop/next.txt 2>/dev/null || echo done)
          if [ "$MODE" = "deliver" ] && [ "$next" = "more" ] && [ "${HOP:-0}" -lt 12 ]; then
            gh workflow run v3-live.yml -R "$GITHUB_REPOSITORY" -f mode=deliver -f batch=2 -f day="$DAY" -f hop=$(( ${HOP:-0} + 1 )) && echo "next run started (hop $(( ${HOP:-0} + 1 )))"
          else
            echo "no next run: next=$next mode=$MODE hop=${HOP:-0}"
          fi
