name: reach-runner

# REACH v2 (2026-08-05): the cookie-gated discovery channels from the
# agent-reach adoption map, running on a GitHub runner because Reddit and X
# both wall our Hostinger IP (measured: cookie'd reddit .json still 403s from
# the server; the wall is IP-reputation + fingerprint, not just auth).
#
# v1 proved: X burner authenticates (twitter-cli status -> @Nightygxa), and
# reach-drop delivery works once the token has contents:write.
# v2 finishes Reddit: rdt-cli never saw the cookie because it reads
# ~/.config/rdt-cli/credential.json — so we WRITE that file from the secret,
# in the exact shape rdt_cli/auth.py Credential.to_dict() produces
# ({"cookies":{...},"source","username","modhash","saved_at",...}), with
# reddit_session present (constants.REQUIRED_COOKIES = {"reddit_session"}).
# Every harvest verb below is copied from the tools' OWN --help captured by
# v1 (help-rdt.txt / help-twitter.txt) — never guessed.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reach-runner.yml"
      - "tools/reach_video_search.py"
      - "tools/reach_term_usage.py"
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

concurrency:
  group: reach-runner
  cancel-in-progress: true

# the delivery step pushes the reach-drop branch; the default token is
# read-only (run #1 failed 403 on exactly this)
permissions:
  contents: write

jobs:
  reach:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
      TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
      REDDIT_COOKIES: ${{ secrets.REDDIT_COOKIES }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install channel tools
        run: |
          set +e
          mkdir -p drop
          pip install --quiet "git+https://github.com/jackwener/twitter-cli.git" 2>drop/install-twitter.err
          echo "twitter-cli install exit=$?" | tee -a drop/reach.log
          # pinned commit from the agent-reach study (PyPI lags upstream)
          pip install --quiet "git+https://github.com/public-clis/rdt-cli.git@5e4fb3720d5c174e976cd425ccc3b879d52cac66" 2>drop/install-rdt.err
          echo "rdt-cli install exit=$?" | tee -a drop/reach.log

      - name: write rdt credential from secret
        env:
          RC: ${{ secrets.REDDIT_COOKIES }}
        run: |
          python - <<'PY'
          import json, os, time, pathlib
          raw = os.environ.get("RC", "")
          cookies = {}
          for part in raw.split(";"):
              part = part.strip()
              if not part or "=" not in part:
                  continue
              k, v = part.split("=", 1)
              cookies[k.strip()] = v.strip()
          d = pathlib.Path.home() / ".config" / "rdt-cli"
          d.mkdir(parents=True, exist_ok=True)
          f = d / "credential.json"
          f.write_text(json.dumps({
              "cookies": cookies,
              "source": "ci-secret",
              "username": None,
              "modhash": None,
              "saved_at": time.time(),
              "last_verified_at": None,
          }, indent=2))
          f.chmod(0o600)
          print("credential written, cookie names:", sorted(cookies))
          print("reddit_session present:", "reddit_session" in cookies)
          PY

      - name: reddit harvest (r/OutOfTheLoop = our discovery source)
        run: |
          set +e
          echo "== rdt status ==" > drop/reddit.txt
          timeout 90 rdt status >> drop/reddit.txt 2>&1
          echo "exit=$?" >> drop/reddit.txt
          echo "== rdt sub OutOfTheLoop --limit 25 ==" >> drop/reddit.txt
          timeout 120 rdt sub OutOfTheLoop --limit 25 >> drop/reddit.txt 2>&1
          echo "exit=$?" >> drop/reddit.txt
          # machine-readable copy for the server ingest (export writes a file)
          timeout 120 rdt sub OutOfTheLoop --limit 25 --json > drop/reddit-ootl.json 2>drop/reddit-json.err
          echo "json exit=$? bytes=$(wc -c < drop/reddit-ootl.json)" >> drop/reddit.txt

      - name: x harvest (drama discovery + social-post citations)
        run: |
          set +e
          echo "== twitter status ==" > drop/x.txt
          timeout 90 twitter status >> drop/x.txt 2>&1
          echo "exit=$?" >> drop/x.txt
          for q in "streamer drama" "youtuber apology"; do
            echo "== twitter search \"$q\" ==" >> drop/x.txt
            timeout 120 twitter search "$q" -n 15 --min-likes 50 >> drop/x.txt 2>&1
            echo "exit=$?" >> drop/x.txt
          done
          timeout 120 twitter search "streamer drama" -n 15 --min-likes 50 --json > drop/x-search.json 2>drop/x-json.err
          echo "json exit=$? bytes=$(wc -c < drop/x-search.json)" >> drop/x.txt

      # REACH-POWERED VIDEO (2026-08-05): the video-feed branch lists the
      # maker's pending pages — search X for each story's REAL viral posts
      # (people names + title keywords). The server ingest writes them into
      # video_scripts.reach_posts; receipt building renders them as verified
      # X cards (syndication check fail-closed) so people-stories stop being
      # visually starved. Grave stories skipped inside the tool (r16 law).
      - name: story-driven x harvest (per pending video page)
        run: |
          set +e
          git fetch --depth 1 origin video-feed 2>>drop/reach.log \
            && git show FETCH_HEAD:feed.json > feed-video.json \
            || echo '{}' > feed-video.json
          echo "video feed bytes=$(wc -c < feed-video.json)" | tee -a drop/reach.log
          timeout 600 python tools/reach_video_search.py feed-video.json drop/x-pages.json >> drop/reach.log 2>&1
          echo "x-pages exit=$? bytes=$(wc -c < drop/x-pages.json 2>/dev/null || echo 0)" | tee -a drop/reach.log
          tail -30 drop/reach.log

      # PER-TERM USAGE (2026-08-29): the reach-feed branch lists terms the
      # slang/meme/gaming citation gate needs evidence for. Search each on X
      # (quoted phrase) + Reddit; the server turns real dated posts into
      # social_post citations — the evidence class the 2026-08-22 owner
      # decision said "lives on TikTok/Reddit/X, none of which we can
      # retrieve". Now we retrieve two of the three.
      - name: per-term usage harvest (citation evidence)
        run: |
          set +e
          git fetch --depth 1 origin reach-feed 2>>drop/reach.log \
            && git show FETCH_HEAD:terms-wanted.json > terms-wanted.json \
            || echo '{}' > terms-wanted.json
          echo "terms feed bytes=$(wc -c < terms-wanted.json)" | tee -a drop/reach.log
          timeout 600 python tools/reach_term_usage.py terms-wanted.json drop/term-usage.json >> drop/reach.log 2>&1
          echo "term-usage exit=$? bytes=$(wc -c < drop/term-usage.json 2>/dev/null || echo 0)" | tee -a drop/reach.log
          tail -20 drop/reach.log

      - name: deliver to reach-drop branch
        run: |
          set -e
          cd drop
          git init -q
          git checkout -q -b reach-drop
          git add -A
          git -c user.name=reach-runner -c user.email=reach@genzhype \
              commit -qm "reach harvest $(date -u +%FT%TZ) run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" reach-drop
          echo "delivered"
