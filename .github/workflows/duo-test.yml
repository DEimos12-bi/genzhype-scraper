name: duo-test

# TEST ONLY (owner 2026-11-10): "Blu and Dots", the two-AI style, on top of the whole v3 video system (this branch is a
# copy of v3 with the style added: V3_STYLE=duo). One story in, one video out. Posts NOTHING, sends nothing to the site.
# The finished video never sits readable on public GitHub (owner rule 2026-11-01): it leaves this run ENCRYPTED with the
# public key in duo/pub.pem; only the server holds the key that opens it. The log is pushed as it is.

on:
  push:
    branches: [duo-test]

permissions:
  contents: write

concurrency:
  group: duo-test
  cancel-in-progress: true

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache the browser and the pip wheels
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/pip
            ~/.cache/huggingface
          key: v3-live-${{ runner.os }}-1

      - name: Install (ffmpeg, Chromium, the voice, the speech model, the clip tools)
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq >/dev/null 2>&1 || true; sudo timeout 200 apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true; }
          ffmpeg -version | head -1
          python -m pip install --upgrade pip 2>&1 | tail -1
          python -m pip install -r v3/requirements.txt faster-whisper scenedetect brotli soundfile "yt-dlp[default,curl-cffi]" 2>&1 | tail -2
          python -m playwright install --with-deps chromium 2>&1 | tail -2
          sudo timeout 120 apt-get install -y -qq fonts-noto-color-emoji >/dev/null 2>&1 || echo "no emoji font"

      - name: Make the video (two voices)
        env:
          V3_STYLE: duo
          LINK: https://genzhype.com/drama/suno-faces-lawsuits-from-elvis-estate-and-eminem-publisher-over-ai-infringement/
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2L5 || secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3L12 || secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEYL12 || secrets.GEMINI_API_KEY_5 }}
          AI_PROBE_NVIDIA: ${{ secrets.AI_PROBE_NVIDIA }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2L34 || secrets.NVIDIA_API_KEY_2 }}
          NVIDIA_API_KEY_3: ${{ secrets.NVIDIA_API_KEY_3 }}
          NVIDIA_API_KEY_4: ${{ secrets.NVIDIA_API_KEYL0 || secrets.NVIDIA_API_KEY_4 }}
          NVIDIA_API_KEY_5: ${{ secrets.AI_PROBE_NVIDIA_DIRECTOR }}
          AI_PROBE_NVIDIA_DIRECTOR: ${{ secrets.AI_PROBE_NVIDIA_DIRECTOR }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          AI_PROBE_OPENROUTER: ${{ secrets.AI_PROBE_OPENROUTER }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
        run: |
          mkdir -p drop
          cd v3
          W=work/duo
          mkdir -p "$W"
          cp ../duo/material.json "$W/material.json"      # read on the server: the site refuses GitHub's machines now and then
          {
            for i in 1 2 3; do
              [ -f "$W/material.json" ] && break
              python material.py "$LINK" "$W" && [ -f "$W/material.json" ] && break
              echo "duo: the page could not be read (try $i); again in 30 s"; sleep 30
            done
            [ -f "$W/material.json" ] || { echo "duo: no material: the site did not answer this machine"; exit 0; }
            t0=$(date +%s); rc=3; n=0
            while [ $rc -eq 3 ] && [ $n -lt 10 ] && [ $(( $(date +%s) - t0 )) -lt 5400 ]; do
              timeout 3000 python make.py "$W"; rc=$?; n=$((n+1))
              echo "duo: make.py call $n ended with code $rc after $(( $(date +%s) - t0 )) s"
              ls "$W"/out/*.mp4 >/dev/null 2>&1 && break
            done
          } 2>&1 | tee ../drop/run.log
          ls -la "$W" "$W/out" 2>/dev/null | head -60

      - name: Pack the result, encrypted (the video is never readable here)
        if: always()
        run: |
          W=v3/work/duo
          [ -d "$W" ] || { echo "nothing to pack"; exit 0; }
          mkdir -p pack
          cp -r "$W/out" pack/ 2>/dev/null || true
          for f in plan.json timeline.json material.json comp.json render_errors.txt; do [ -f "$W/$f" ] && cp "$W/$f" pack/ || true; done
          tar -czf out.tgz -C pack .
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:k.txt -in out.tgz -out drop/out.enc
          openssl pkeyutl -encrypt -pubin -inkey duo/pub.pem -in k.txt -out drop/key.enc
          rm -f k.txt out.tgz
          ls -la drop

      - name: Push the result to the duo-drop branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd drop
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b duo-drop
          git add -A
          git commit -q -m "duo test $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nothing to push"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" duo-drop || true
